services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      # Matches the web service's host-mapped port below so the default
      # CORS allowlist in backend/app/main.py works out of the box.
      CORS_ALLOW_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5174:80"
    depends_on:
      - backend
