services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    # Bound to loopback only, not 0.0.0.0 — the backend is never reached
    # directly from outside. Public traffic goes Caddy -> java_service ->
    # backend, all over the internal Docker network. This publish only keeps
    # it reachable for local debugging (curl localhost:8000 on the host)
    # while guaranteeing it's never exposed externally, independent of
    # whatever the EC2 security group happens to allow.
    ports:
      - "127.0.0.1:8000:8000"

  db:
    image: postgres:17-alpine
    env_file:
      - .env
    # Same loopback-only rationale as the other services: only java_service
    # reaches it over the internal network, but publishing it here lets local
    # development (java_service run outside Docker) and psql use it too.
    # Host side is 5433, not 5432, so this doesn't collide with any other
    # PostgreSQL already running on the machine. Container-to-container
    # traffic still uses 5432 (see java_service's DB_URL).
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # java_service fails to start if the database isn't accepting connections
    # yet, so wait for a real readiness check rather than just "container
    # started".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  java_service:
    build:
      context: .
      dockerfile: java_service/Dockerfile
    environment:
      # The FastAPI app is reachable only on the internal Docker network,
      # under its service name — this is the whole "Python stays an
      # internal-only black box" boundary.
      - PYTHON_SERVICE_BASE_URL=http://backend:8000
      - DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-semiscope}
      - DB_USER=${POSTGRES_USER:-semiscope}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # 소셜 로그인 자격증명. 컨테이너 안에는 .env가 없으므로(application.
      # properties의 spring.config.import는 로컬 실행용) 여기서 넘겨야 한다.
      # 빠뜨리면 치환되지 않은 "${GOOGLE_CLIENT_ID}" 문자열이 그대로 구글에
      # 전송돼서, 기동은 성공하지만 로그인만 실패한다.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set in .env}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET must be set in .env}
      # Where to send the browser after a successful login. Caddy serves the
      # frontend and the API from the same origin here, so a bare path is
      # enough. Override it in .env when running this service against a
      # separate Vite dev server — a bare "/" would then land on java_service
      # itself, which has no root mapping (Whitelabel 404 right after a
      # successful login).
      - FRONTEND_URL=${FRONTEND_URL:-/}
      # 구글이 인증 후 돌려보낼 주소. Caddy는 /api/* 만 이 서비스로 보내고
      # 접두사를 떼어내므로, 지정하지 않으면 스프링이 /api 없는 주소를 만들고
      # 구글이 돌려보낸 요청이 정적 페이지로 떨어진다. 실제 도메인이 있어야
      # 정할 수 있는 값이라 .env에서 받는다.
      # 값 없이 이름만 적으면 .env에 있을 때만 전달된다. "=${...:-}" 형태로
      # 쓰면 미설정일 때 빈 문자열이 넘어가 스프링의 기본값을 덮어버리고,
      # redirectUri가 비었다며 기동에 실패한다.
      - OAUTH_REDIRECT_URI
      # 계정 하나가 하루에 태울 수 있는 LLM 호출 수. 이름만 적었으므로
      # .env에 있을 때만 전달되고, 없으면 application.properties의 기본값
      # (40)이 쓰인다. 요금제를 바꾸면 재빌드 없이 여기서 조절한다.
      - DAILY_LLM_LIMIT
    # Same loopback-only rationale as backend above: Caddy reaches this over
    # the internal network, the published port is for host-side debugging.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Relative path: the browser calls the page's own origin, and Caddy's
        # /api/* handler proxies it to the backend over the internal Docker
        # network — so the browser never talks to the backend directly.
        VITE_API_BASE_URL: /api
    environment:
      # Real deploy: set SITE_DOMAIN in .env to the real domain (once bought
      # — see web/Caddyfile) so Caddy requests a real Let's Encrypt cert.
      # Left unset (defaults to "localhost" in the Caddyfile), Caddy issues
      # its own locally-trusted cert instead of calling Let's Encrypt at all
      # — which is what local `docker compose up` testing should do, to
      # avoid tripping Let's Encrypt's production rate limits.
      - SITE_DOMAIN=${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Persists issued certificates (and Caddy's other state) across
      # container recreation — without this, every `docker compose up
      # --build` would re-request a cert from Let's Encrypt, and repeated
      # requests for the same domain get rate-limited.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - java_service

volumes:
  caddy_data:
  caddy_config:
  # 계정·세션 데이터. 컨테이너를 지웠다 다시 만들어도 유지된다.
  postgres_data:
