services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    # Bound to loopback only, not 0.0.0.0 — the backend is reached through
    # web's nginx proxy (see web/nginx.conf's /api/ location), not directly.
    # This keeps it reachable for local debugging (curl localhost:8000 on the
    # host) while guaranteeing it's never exposed externally, independent of
    # whatever the EC2 security group happens to allow.
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Relative path: the browser calls the page's own origin, and nginx's
        # /api/ location proxies it to the backend over the internal Docker
        # network — so the browser never talks to the backend directly.
        VITE_API_BASE_URL: /api
    ports:
      - "5174:80"
    depends_on:
      - backend
