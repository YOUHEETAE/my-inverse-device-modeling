server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom uses client-side routing (BrowserRouter) — a hard
    # refresh on e.g. /fields has no matching file on disk, so fall back to
    # index.html and let the client-side router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxies to the backend over the internal Docker network (service name
    # "backend", see docker-compose.yml) instead of the backend's port being
    # published to the host — the FastAPI process is never reachable directly
    # from outside. The trailing slash on proxy_pass strips the /api prefix,
    # since the backend's own routes aren't prefixed with it.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
