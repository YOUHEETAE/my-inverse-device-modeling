spring.application.name=java-service

# The Python API this replaces used Pydantic's default snake_case JSON field
# names (fixed_biases, net_doping, ...) and the frontend already expects
# that wire format. Rather than annotating every DTO field, translate once
# here: Java stays idiomatic camelCase, Jackson maps it to snake_case JSON
# on the way in and out.
spring.jackson.property-naming-strategy=SNAKE_CASE

# The existing Python FastAPI app (backend/) — its routers become this
# service's internal-only backend once Caddy points at java-service instead
# of backend directly, with no changes needed on the Python side. 127.0.0.1
# is the local-dev default (run `uvicorn app.main:app` on the host); in
# docker-compose this is overridden to the internal service name
# (http://backend:8000).
python.service.base-url=http://127.0.0.1:8000

# Never include a stack trace in error response bodies — ApiExceptionHandler
# already reshapes ResponseStatusException into Python's {"detail": "..."}
# form; this is defense-in-depth for any other unhandled exception type.
server.error.include-stacktrace=never

# Same env var name/default as backend/app/main.py's CORS_ALLOW_ORIGINS, so
# docker-compose can set it once for whichever service is actually
# internet-facing.
cors.allow-origins=${CORS_ALLOW_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}

# Caddy가 TLS를 끝내고 평문 HTTP로 넘겨주기 때문에, 이게 없으면 스프링은
# 자기 주소를 http://...:8080으로 인식함. 그러면 브라우저가 같은 출처
# (https://도메인)에서 보낸 요청인데도 Origin이 다르다고 보고 CORS로
# 판단해서 403 Invalid CORS request로 막아버림 — 실제로 프로덕션 스택에서
# 재현됨. Caddy가 붙여주는 X-Forwarded-Proto/Host를 신뢰해서 원래 주소를
# 복원하게 함.
server.forward-headers-strategy=FRAMEWORK

# --- 데이터베이스 (회원 기능용) ---
# 로컬에서 도커 없이 실행할 때를 위해 저장소 루트의 .env를 읽는다. 없으면
# 그냥 넘어가고(optional), 도커에서는 compose가 환경변수로 직접 주입한다.
spring.config.import=optional:file:../.env[.properties]

# 비밀번호는 기본값을 두지 않음 — 안 넣으면 기동 실패해서 바로 알아챌 수 있게.
# 기본값을 박아두면 그 값이 그대로 커밋되고 운영까지 따라간다.
# 로컬 기본값이 5433인 이유는 docker-compose가 db를 그 포트로 노출하기 때문
# (호스트의 5432는 다른 PostgreSQL이 쓰고 있을 수 있어서 피함).
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/${POSTGRES_DB:semiscope}}
spring.datasource.username=${DB_USER:${POSTGRES_USER:semiscope}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD}}

# 스키마는 Flyway 같은 마이그레이션 도구로 관리할 예정이라 JPA가 테이블을
# 건드리지 않게 함. validate면 엔티티와 실제 테이블이 어긋날 때 기동 시점에
# 잡히고, update/create는 운영에서 데이터를 날릴 수 있어 쓰지 않는다.
spring.jpa.hibernate.ddl-auto=validate

# 세션을 메모리가 아니라 DB에 저장 — 재배포해도 로그인이 유지됨.
spring.session.store-type=jdbc
# 기본값은 30분 무활동인데, 그래프를 보고 파라미터를 바꿔가며 생각하는
# 사용 패턴에서는 쉽게 넘긴다. 세션이 DB에 있어 재배포로도 사라지지 않으므로
# 길게 잡아도 서버 메모리에 부담이 없다.
spring.session.timeout=7d
# 세션 테이블도 Flyway가 소유한다(db/migration/V1) — 스키마 이력을 한 곳에서
# 관리하려고. 스프링이 따로 만들지 않도록 꺼둠.
spring.session.jdbc.initialize-schema=never

# 로그인이 끝나면 브라우저를 여기로 돌려보낸다. 지정하지 않으면 스프링이
# 백엔드의 "/"로 보내는데 그런 경로가 없어서 오류 페이지가 뜬다.
# 로컬은 Vite(5174), 배포는 Caddy가 프론트와 API를 같은 출처로 서빙하므로
# "/"면 충분하다.
app.frontend-url=${FRONTEND_URL:http://localhost:5174}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# openid를 넣으면 스프링이 OIDC 경로로 처리해서 DefaultOAuth2UserService를
# 상속한 CustomOAuth2UserService가 호출되지 않는다(OidcUserService 쪽으로 감).
# 카카오·네이버는 OIDC가 아니므로, 제공자를 늘려도 코드 경로가 하나로
# 유지되도록 일반 OAuth2로 통일한다. sub/email/name은 userinfo 엔드포인트에서
# 동일하게 받아온다.
spring.security.oauth2.client.registration.google.scope=profile,email

# 구글에 이미 로그인돼 있으면 계정 선택 없이 바로 통과시키는 것이 기본
# 동작인데(SSO), 교육용이라 실습실 같은 공용 PC에서 앞사람 계정으로 그대로
# 로그인되는 사고가 날 수 있어 항상 계정 선택 화면을 띄운다.
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account
