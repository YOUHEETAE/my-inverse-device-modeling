# 테스트 전용 설정 — 실제 PostgreSQL 없이 인메모리 H2로 돈다.
# application.properties(운영 기본값)에 더해서 적용되며, 겹치는 값만 덮어씀.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# 운영은 마이그레이션 도구가 스키마를 만들지만, 테스트에서는 엔티티 기준으로
# 매번 새로 만들고 끝나면 버린다.
spring.jpa.hibernate.ddl-auto=create-drop

# 세션 테이블도 테스트에서는 자동 생성.
spring.session.jdbc.initialize-schema=always

# 마이그레이션은 PostgreSQL 전용 문법이라 H2에서 그대로 돌지 않는다. 스키마
# 자체는 위 ddl-auto/initialize-schema로 만들어지므로 테스트에는 지장이
# 없지만, 그래서 마이그레이션 SQL 자체는 테스트가 검증하지 못한다 — 실제
# 검증은 docker compose로 띄워서 확인해야 한다.
spring.flyway.enabled=false
